<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umair AI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#fafafa;--surface:#f4f4f4;--card:#efefef;
  --border:#e4e4e4;--text:#111;--muted:#999;
  --ok:#16a34a;--err:#dc2626;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

/* LOADER */
#loader{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9999;transition:opacity .7s,visibility .7s;}
#loader.gone{opacity:0;visibility:hidden;}
.l-logo{font-size:36px;font-weight:900;color:#fff;letter-spacing:-2px;}
.l-logo em{color:#555;font-style:normal;font-weight:300;}
.l-bar{width:140px;height:1.5px;background:#333;border-radius:2px;overflow:hidden;}
.l-fill{height:100%;background:#fff;animation:lf 2s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes lf{from{width:0}to{width:100%}}
.l-sub{font-size:10px;color:#555;letter-spacing:3px;text-transform:uppercase;}

/* HEADER */
.hdr{height:54px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(250,250,250,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50;flex-shrink:0;}
.brand{font-size:16px;font-weight:800;letter-spacing:-.5px;}
.brand em{color:var(--muted);font-style:normal;font-weight:400;}
.hdr-r{display:flex;align-items:center;gap:8px;}
.pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--muted);cursor:pointer;transition:.2s;}
.pill:hover{border-color:#bbb;color:var(--text);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--err);transition:background .3s;}
.dot.on{background:var(--ok);}
.ibtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:.2s;}
.ibtn:hover{background:var(--card);}

/* VIEWS */
.view{display:none;flex:1;flex-direction:column;overflow:hidden;}
.view.on{display:flex;}

/* ── HOME ── */
#home{overflow-y:auto;align-items:center;padding:28px 16px 40px;}
.home-wrap{width:100%;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:24px;}

.greeting{text-align:center;}
.greeting h1{font-size:clamp(26px,5vw,40px);font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin-bottom:6px;}
.greeting p{font-size:13px;color:var(--muted);}

/* MODEL SELECTOR on home */
.model-row{display:flex;align-items:center;gap:8px;width:100%;}
.model-row label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.model-sel{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:12px;color:var(--text);outline:none;cursor:pointer;transition:border-color .2s;}
.model-sel:focus{border-color:#aaa;}

/* TOPICS */
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;}
.tc{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 11px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:8px;}
.tc:hover{border-color:#bbb;box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px);}
.tc .ic{font-size:15px;flex-shrink:0;}
.tc .tx{display:flex;flex-direction:column;gap:1px;}
.tc .tt{font-size:11px;font-weight:700;color:var(--text);line-height:1.2;}
.tc .td{font-size:10px;color:var(--muted);line-height:1.3;}

.new-btn{width:100%;background:#111;color:#fff;border:none;border-radius:12px;padding:13px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;letter-spacing:-.2px;}
.new-btn:hover{background:#2a2a2a;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.12);}

/* ── CHAT ── */
#chat{flex-direction:column;}
.chat-bar{height:42px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;background:var(--bg);}
.back-btn{font-size:12px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:3px;padding:4px 8px;border-radius:7px;transition:.15s;border:none;background:none;font-family:'Inter',sans-serif;}
.back-btn:hover{background:var(--surface);color:var(--text);}
.chat-model-badge{font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:2px 8px;border-radius:20px;margin-left:auto;}

.msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px;}
.msgs::-webkit-scrollbar{width:0;}

.msg{display:flex;gap:8px;animation:mi .22s ease;}
@keyframes mi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse;}
.av{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.msg.ai .av{background:#111;color:#fff;}
.msg.user .av{background:var(--card);border:1px solid var(--border);font-size:13px;}
.bbl{max-width:80%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.6;word-break:break-word;}
.msg.ai .bbl{background:#fff;border:1px solid var(--border);border-top-left-radius:3px;}
.msg.user .bbl{background:#111;color:#fff;border-top-right-radius:3px;}

/* typing */
.tdots{display:flex;gap:3px;align-items:center;padding:4px 2px;}
.td{width:5px;height:5px;border-radius:50%;background:#bbb;animation:tp 1.2s infinite;}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* input */
.ibar{padding:10px 14px 14px;border-top:1px solid var(--border);background:#fff;flex-shrink:0;}
.iwrap{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 6px 6px 14px;transition:border-color .2s;}
.iwrap:focus-within{border-color:#bbb;}
.mi{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);resize:none;min-height:34px;max-height:110px;padding:5px 0;line-height:1.5;}
.mi::placeholder{color:#ccc;}
.sbtn{width:34px;height:34px;border-radius:9px;background:#111;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:.2s;}
.sbtn:hover{background:#333;}
.sbtn:disabled{background:#ddd;cursor:not-allowed;}

/* SETTINGS */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;}
.ovl.on{display:flex;}
.sp{background:#fff;border-radius:24px;padding:26px;width:min(420px,94vw);position:relative;box-shadow:0 20px 60px rgba(0,0,0,.13);animation:mi .25s ease;max-height:90vh;overflow-y:auto;}
.sp-x{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
.sp-x:hover{background:var(--card);}
.sp h2{font-size:19px;font-weight:800;letter-spacing:-.5px;margin-bottom:3px;}
.sp-sub{font-size:12px;color:var(--muted);margin-bottom:20px;}

/* model list in settings */
.model-list{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;max-height:220px;overflow-y:auto;}
.ml-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:.15s;}
.ml-item:hover{background:var(--card);}
.ml-item.sel{background:#111;color:#fff;}
.ml-item.sel .ml-tag{background:rgba(255,255,255,.15);color:#fff;}
.ml-name{font-size:12px;font-weight:600;flex:1;}
.ml-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:#dcfce7;color:#16a34a;}
.ml-tag.paid{background:#fef3c7;color:#92400e;}

.sp-lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block;}
.sp-iw{position:relative;margin-bottom:14px;}
.sp-in{width:100%;padding:11px 40px 11px 13px;border:1px solid var(--border);border-radius:11px;font-family:'Inter',sans-serif;font-size:13px;background:var(--surface);outline:none;transition:border-color .2s;}
.sp-in:focus{border-color:#999;}
.eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;}
.sp-save{width:100%;background:#111;color:#fff;border:none;border-radius:11px;padding:12px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;}
.sp-save:hover{background:#2a2a2a;}
.sp-link{text-align:center;margin-top:12px;font-size:11px;color:var(--muted);}
.sp-link a{color:#111;font-weight:600;text-decoration:none;}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 18px;border-radius:100px;font-size:12px;z-index:999;display:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);}

@media(max-width:480px){
  .topics{grid-template-columns:repeat(2,1fr);}
  .bbl{max-width:90%;font-size:13px;}
  .hdr{padding:0 14px;}
  .msgs{padding:12px 12px 6px;}
  .ibar{padding:8px 12px 12px;}
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="l-logo">Umair<em> AI</em></div>
  <div class="l-bar"><div class="l-fill"></div></div>
  <div class="l-sub">Studio · Starting</div>
</div>

<!-- HEADER -->
<header class="hdr">
  <div class="brand">Umair<em> AI Studio</em></div>
  <div class="hdr-r">
    <div class="pill" onclick="openSettings()">
      <div class="dot" id="dot"></div>
      <span id="stxt">Setup</span>
    </div>
    <div class="ibtn" onclick="openSettings()">⚙️</div>
  </div>
</header>

<!-- HOME -->
<div class="view on" id="home">
  <div class="home-wrap">

    <div class="greeting">
      <h1>Hello, I'm<br>Umair AI Studio</h1>
      <p>Your smart AI assistant — ask anything</p>
    </div>

    <div class="model-row">
      <label>Model</label>
      <select class="model-sel" id="home-model" onchange="changeModel(this.value)"></select>
    </div>

    <div class="topics" id="topics"></div>

    <button class="new-btn" onclick="startChat('')">+ New Conversation</button>

  </div>
</div>

<!-- CHAT -->
<div class="view" id="chat">
  <div class="chat-bar">
    <button class="back-btn" onclick="goHome()">← Home</button>
    <div class="chat-model-badge" id="chat-badge"></div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="ibar">
    <div class="iwrap">
      <textarea class="mi" id="mi" placeholder="Message Umair AI Studio..." rows="1"
        onkeydown="handleKey(event)" oninput="rsz(this)"></textarea>
      <button class="sbtn" id="sbtn" onclick="send()">➤</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="ovl" id="ovl" onclick="ovlClick(event)">
  <div class="sp">
    <div class="sp-x" onclick="closeSettings()">✕</div>
    <h2>⚙️ Settings</h2>
    <div class="sp-sub">Choose model & add your OpenRouter key</div>

    <label class="sp-lbl">Select AI Model</label>
    <div class="model-list" id="model-list"></div>

    <label class="sp-lbl">OpenRouter API Key</label>
    <div class="sp-iw">
      <input class="sp-in" type="password" id="key-in" placeholder="sk-or-v1-..." autocomplete="off">
      <button class="eye" onclick="toggleEye()">👁️</button>
    </div>

    <button class="sp-save" onclick="saveSettings()">💾 Save & Connect</button>
    <div class="sp-link">No key? <a href="https://openrouter.ai/keys" target="_blank">Get free key from OpenRouter →</a></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── MODELS ──
const MODELS = [
  {id:'meta-llama/llama-3.3-70b-instruct:free',  name:'Llama 3.3 70B',       free:true},
  {id:'meta-llama/llama-3.1-8b-instruct:free',   name:'Llama 3.1 8B',        free:true},
  {id:'google/gemma-3-27b-it:free',              name:'Gemma 3 27B',         free:true},
  {id:'google/gemma-3-12b-it:free',              name:'Gemma 3 12B',         free:true},
  {id:'mistralai/mistral-7b-instruct:free',      name:'Mistral 7B',          free:true},
  {id:'deepseek/deepseek-r1:free',               name:'DeepSeek R1',         free:true},
  {id:'deepseek/deepseek-chat-v3-0324:free',     name:'DeepSeek V3',         free:true},
  {id:'qwen/qwen3-8b:free',                      name:'Qwen3 8B',            free:true},
  {id:'microsoft/phi-3-mini-128k-instruct:free', name:'Phi-3 Mini',          free:true},
  {id:'openai/gpt-4o-mini',                      name:'GPT-4o Mini',         free:false},
  {id:'openai/gpt-4o',                           name:'GPT-4o',              free:false},
  {id:'anthropic/claude-3.5-haiku',              name:'Claude 3.5 Haiku',    free:false},
];

// ── TOPICS ──
const TOPICS = [
  {ic:'🧮', tt:'Math',       td:'Algebra, equations',   p:'Help me solve a math problem step by step.'},
  {ic:'💪', tt:'Workout',    td:'Fitness & exercise',   p:'Help me with a workout plan.'},
  {ic:'💻', tt:'Coding',     td:'Debug & write code',   p:'Help me with coding and programming.'},
  {ic:'📚', tt:'Study',      td:'Learn any subject',    p:'Help me study and understand a topic.'},
  {ic:'🌍', tt:'Translate',  td:'Any language',         p:'Translate this text for me:'},
  {ic:'✍️', tt:'Writing',    td:'Essays & articles',    p:'Help me write an essay or article.'},
  {ic:'🔬', tt:'Science',    td:'Physics, chemistry',   p:'Explain a science concept to me.'},
  {ic:'📖', tt:'History',    td:'World history',        p:'Tell me about a historical event or topic.'},
  {ic:'💰', tt:'Finance',    td:'Money & budgeting',    p:'Give me financial advice or explain a finance topic.'},
  {ic:'🎨', tt:'Creative',   td:'Ideas & brainstorm',   p:'Help me brainstorm creative ideas.'},
  {ic:'🏥', tt:'Health',     td:'Wellness & diet',      p:'Give me health and wellness advice.'},
  {ic:'❓', tt:'Anything',   td:'Any question',         p:'I have a question I need help with.'},
];

// ── STATE ──
let apiKey = localStorage.getItem('u_key') || '';
let selModel = localStorage.getItem('u_model') || MODELS[0].id;
let history = [];
let busy = false;

// ── INIT ──
window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('loader').classList.add('gone'), 2000);
  buildModels();
  buildTopics();
  if (apiKey) setStatus(true);
});

function buildModels() {
  // Home dropdown
  const sel = document.getElementById('home-model');
  sel.innerHTML = '';
  MODELS.forEach(m => {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.name + (m.free ? ' ✓' : ' $');
    if (m.id === selModel) o.selected = true;
    sel.appendChild(o);
  });

  // Settings list
  const list = document.getElementById('model-list');
  list.innerHTML = '';
  MODELS.forEach(m => {
    const d = document.createElement('div');
    d.className = 'ml-item' + (m.id === selModel ? ' sel' : '');
    d.dataset.id = m.id;
    d.innerHTML = `<span class="ml-name">${m.name}</span><span class="ml-tag${m.free?'':' paid'}">${m.free?'FREE':'PAID'}</span>`;
    d.onclick = () => {
      selModel = m.id;
      document.querySelectorAll('.ml-item').forEach(x => x.classList.remove('sel'));
      d.classList.add('sel');
      document.getElementById('home-model').value = m.id;
      localStorage.setItem('u_model', m.id);
    };
    list.appendChild(d);
  });
}

function buildTopics() {
  const wrap = document.getElementById('topics');
  wrap.innerHTML = '';
  TOPICS.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tc';
    d.innerHTML = `<span class="ic">${t.ic}</span><div class="tx"><div class="tt">${t.tt}</div><div class="td">${t.td}</div></div>`;
    d.onclick = () => startChat(t.p);
    wrap.appendChild(d);
  });
}

function changeModel(id) {
  selModel = id;
  localStorage.setItem('u_model', id);
  document.querySelectorAll('.ml-item').forEach(x => {
    x.classList.toggle('sel', x.dataset.id === id);
  });
}

function setStatus(on) {
  document.getElementById('dot').className = 'dot' + (on ? ' on' : '');
  document.getElementById('stxt').textContent = on ? 'Connected' : 'Setup';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function rsz(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

// ── NAV ──
function goHome() {
  document.getElementById('home').classList.add('on');
  document.getElementById('chat').classList.remove('on');
}

function startChat(prompt) {
  if (!apiKey) { openSettings(); toast('Add your API key first!'); return; }
  document.getElementById('home').classList.remove('on');
  document.getElementById('chat').classList.add('on');
  history = [{ role:'system', content:'You are Umair AI Studio, a helpful, smart, and friendly AI assistant. Be clear and concise.' }];
  document.getElementById('msgs').innerHTML = '';

  const mName = MODELS.find(m => m.id === selModel)?.name || selModel;
  document.getElementById('chat-badge').textContent = mName;

  addBubble('ai', "Hi! I'm Umair AI Studio. How can I help you today? 😊");

  if (prompt) {
    const inp = document.getElementById('mi');
    inp.value = prompt;
    rsz(inp);
    inp.focus();
  } else {
    document.getElementById('mi').focus();
  }
}

// ── CHAT ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function addBubble(role, text) {
  const msgs = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const av = role === 'ai'
    ? '<div class="av">U</div>'
    : '<div class="av">👤</div>';
  d.innerHTML = av + `<div class="bbl">${text.replace(/\n/g,'<br>')}</div>`;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function addTyping() {
  const msgs = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'msg ai'; d.id = 'typing';
  d.innerHTML = '<div class="av">U</div><div class="bbl"><div class="tdots"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>';
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

async function send() {
  if (busy) return;
  if (!apiKey) { openSettings(); return; }
  const inp = document.getElementById('mi');
  const text = inp.value.trim();
  if (!text) return;

  inp.value = ''; rsz(inp);
  addBubble('user', text);
  history.push({ role:'user', content:text });

  busy = true;
  document.getElementById('sbtn').disabled = true;
  addTyping();

  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer ' + apiKey,
        'HTTP-Referer':'https://umair-studio.github.io',
        'X-Title':'Umair AI Studio'
      },
      body: JSON.stringify({ model:selModel, messages:history, max_tokens:1500 })
    });

    const data = await res.json();
    document.getElementById('typing')?.remove();

    if (data.error) throw new Error(data.error.message || 'API Error');
    const reply = data.choices?.[0]?.message?.content || 'No response.';
    history.push({ role:'assistant', content:reply });
    addBubble('ai', reply);

  } catch(err) {
    document.getElementById('typing')?.remove();
    let msg = err.message;
    if (msg.includes('401')||msg.includes('key')||msg.includes('auth')) msg='🔑 Invalid API key. Check Settings.';
    else if (msg.includes('429')) msg='⏳ Rate limit. Wait a moment and retry.';
    else if (msg.includes('fetch')||msg.includes('Failed')) msg='🌐 Network error. Check your connection.';
    else if (msg.includes('No endpoints')||msg.includes('model')) msg='⚠️ This model is unavailable. Try another from Settings.';
    addBubble('ai', msg);
  }

  busy = false;
  document.getElementById('sbtn').disabled = false;
  document.getElementById('msgs').scrollTop = 9999;
}

// ── SETTINGS ──
function openSettings() {
  document.getElementById('key-in').value = apiKey;
  document.getElementById('ovl').classList.add('on');
}
function closeSettings() { document.getElementById('ovl').classList.remove('on'); }
function ovlClick(e) { if (e.target === document.getElementById('ovl')) closeSettings(); }
function toggleEye() {
  const inp = document.getElementById('key-in');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  inp.nextElementSibling.textContent = inp.type === 'password' ? '👁️' : '🙈';
}
function saveSettings() {
  const val = document.getElementById('key-in').value.trim();
  if (!val) { toast('Please enter your OpenRouter API key'); return; }
  apiKey = val;
  localStorage.setItem('u_key', apiKey);
  localStorage.setItem('u_model', selModel);
  setStatus(true);
  closeSettings();
  toast('✓ Saved & Connected!');
}
</script>
