<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMAIR AI STUDIO - Advanced Chat</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sidebar: '#171717',
                        main: '#212121',
                        input: '#2f2f2f',
                        bubble: '#2f2f2f',
                        hover: '#2a2a2a',
                        accent: '#10a37f',
                        'accent-hover': '#0d8c6d',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background: #212121;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #root {
            height: 100vh;
            width: 100vw;
        }
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
        textarea {
            resize: none;
            outline: none;
            field-sizing: content;
            min-height: 24px;
            max-height: 200px;
            line-height: 1.5;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes pulse-dot {
            0%,
            80%,
            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        .pulse-dot {
            animation: pulse-dot 1.4s infinite;
        }
        .pulse-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .pulse-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        .sidebar-transition {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        @media (max-width: 768px) {
            .sidebar-mobile {
                position: fixed;
                z-index: 50;
                height: 100vh;
                left: 0;
                top: 0;
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar-mobile.open {
                transform: translateX(0);
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                z-index: 45;
            }
            .sidebar-overlay.open {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

        // ============ CONSTANTS ============
        const STORAGE_KEY = 'umair_ai_studio_data';
        const DEFAULT_MODEL = 'deepseek/deepseek-chat';

        const AVAILABLE_MODELS = [
            { id: 'deepseek/deepseek-chat', name: 'DeepSeek-V3', provider: 'DeepSeek', vision: false },
            { id: 'deepseek/deepseek-r1', name: 'DeepSeek-R1', provider: 'DeepSeek', vision: false },
            { id: 'openai/gpt-4o', name: 'GPT-4o', provider: 'OpenAI', vision: true },
            { id: 'openai/gpt-4o-mini', name: 'GPT-4o Mini', provider: 'OpenAI', vision: true },

            vision: true },
            { id: 'anthropic/claude-3-opus', name: 'Claude 3 Opus', provider: 'Anthropic', vision: true },
            { id: 'google/gemini-2.0-flash-001', name: 'Gemini 2.0 Flash', provider: 'Google',
        vision: true },
            { id: 'google/gemini-1.5-pro', name: 'Gemini 1.5 Pro', provider: 'Google', vision: true },
            { id: 'meta-llama/llama-3.2-90b-vision-instruct', name: 'Llama 3.2 90B Vision',
                provider: 'Meta', vision: true },
            { id: 'meta-llama/llama-3.1-70b-instruct', name: 'Llama 3.1 70B', provider: 'Meta',
            vision: false },
            { id: 'mistralai/mistral-large', name: 'Mistral Large', provider: 'Mistral', vision: false },
        ];

        const SUGGESTIONS = [
            {
                title: 'Science',
                prompt: 'Explain the concept of quantum entanglement in simple terms with real-world analogies.',
                icon: '🔬',
                color: 'from-blue-600/20 to-cyan-600/20 border-blue-500/30 hover:border-blue-400/60'
            },
            {
                title: 'Mathematics',
                prompt: 'Walk me through solving a complex calculus problem: find the derivative of f(x) = x³sin(x) + e²ˣ using the product and chain rules.',
                icon: '📐',
                color: 'from-purple-600/20 to-pink-600/20 border-purple-500/30 hover:border-purple-400/60'
            },
            {
                title: 'Coding Assistance',
                prompt: 'Write a Python function that implements a binary search tree with insert, delete, and search operations. Include time complexity analysis.',
                icon: '💻',
                color: 'from-green-600/20 to-emerald-600/20 border-green-500/30 hover:border-green-400/60'
            },
            {
                title: 'Creative Writing',
                prompt: 'Write a short story about a detective who discovers they can communicate with the memories stored in old photographs.',
                icon: '✨',
                color: 'from-orange-600/20 to-amber-600/20 border-orange-500/30 hover:border-orange-400/60'
            },
            {
                title: 'History & Philosophy',
                prompt: 'Compare and contrast the philosophical ideas of Stoicism and Existentialism. How do they each approach the meaning of life?',
                icon: '🏛️',
                color: 'from-red-600/20 to-rose-600/20 border-red-500/30 hover:border-red-400/60'
            },
            {
                title: 'Technology Trends',
                prompt: 'Analyze the current state of AI in 2025-2026. What are the most significant breakthroughs and where is the technology heading?',
                icon: '🚀',
                color: 'from-indigo-600/20 to-violet-600/20 border-indigo-500/30 hover:border-indigo-400/60'
            },
        ];

        // ============ UTILS ============
        function generateId() {
            return 'chat_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    return {
                        chats: data.chats || [],
                        settings: data.settings || { apiKey: '', model: DEFAULT_MODEL },
                    };
                }
            } catch (e) { /* ignore */ }
            return { chats: [], settings: { apiKey: '', model: DEFAULT_MODEL } };
        }

        function saveToStorage(chats, settings) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ chats, settings }));
            } catch (e) { /* ignore */ }
        }

        function getModelInfo(modelId) {
            return AVAILABLE_MODELS.find(m => m.id === modelId) || null;
        }

        // ============ ICON COMPONENTS ============
        const Icons = {
            Gear: ({ className = 'w-5 h-5' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 1.8 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" /
                >
                <
                circle cx = "12"
                cy = "12"
                r = "3"
                strokeLinecap = "round"
                strokeLinejoin = "round" / >
                <
                /svg>
            ),
            Trash: ({ className = 'w-4 h-4' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 1.8 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /
                >
                <
                /svg>
            ),
            Plus: ({ className = 'w-5 h-5' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 2 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "M12 4.5v15m7.5-7.5h-15" / >
                <
                /svg>
            ),
            Send: ({ className = 'w-5 h-5' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 2 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" / >
                <
                /svg>
            ),
            Image: ({ className = 'w-5 h-5' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 1.8 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0 0 22.5 18.75V5.25A2.25 2.25 0 0 0 20.25 3H3.75A2.25 2.25 0 0 0 1.5 5.25v13.5A2.25 2.25 0 0 0 3.75 21Zm16.5-13.5a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" /
                >
                <
                /svg>
            ),
            Close: ({ className = 'w-5 h-5' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 2 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "M6 18 18 6M6 6l12 12" / >
                <
                /svg>
            ),
            Menu: ({ className = 'w-5 h-5' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 2 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" / >
                <
                /svg>
            ),
            Sparkle: ({ className = 'w-5 h-5' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 1.8 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 0 0-2.455 2.456Z" /
                >
                <
                /svg>
            ),
            Paperclip: ({ className = 'w-5 h-5' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 1.8 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01a2.25 2.25 0 0 1-3.182-3.182L15.318 5.191" /
                >
                <
                /svg>
            ),
            Eye: ({ className = 'w-4 h-4' } = {}) => ( <
                svg className = { className }
                fill = "none"
                stroke = "currentColor"
                strokeWidth = { 1.8 }
                viewBox = "0 0 24 24" >
                <
                path strokeLinecap = "round"
                strokeLinejoin = "round"
                d = "M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /
                >
                <
                circle cx = "12"
                cy = "12"
                r = "3"
                strokeLinecap = "round"
                strokeLinejoin = "round" / >
                <
                /svg>
            ),
        };

        // ============ APP COMPONENT ============
        function App() {
            const initialData = useRef(loadFromStorage()).current;
            const [chats, setChats] = useState(initialData.chats);
            const [settings, setSettings] = useState(initialData.settings);
            const [activeChatId, setActiveChatId] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth > 768);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);

            const activeChat = activeChatId ? chats.find(c => c.id === activeChatId) : null;

            // Persist to localStorage whenever chats or settings change
            useEffect(() => {
                saveToStorage(chats, settings);
            }, [chats, settings]);

            // Handle window resize for responsive sidebar
            useEffect(() => {
                const handleResize = () => {
                    const mobile = window.innerWidth <= 768;
                    setIsMobile(mobile);
                    if (!mobile && !sidebarOpen) {
                        setSidebarOpen(true);
                    }
                    if (mobile && sidebarOpen) {
                        setSidebarOpen(false);
                    }
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, [sidebarOpen]);

            const createNewChat = useCallback(() => {
                const newChat = {
                    id: generateId(),
                    title: 'New Chat',
                    messages: [],
                    createdAt: new Date().toISOString(),
                };
                setChats(prev => [newChat, ...prev]);
                setActiveChatId(newChat.id);
                if (isMobile) setSidebarOpen(false);
            }, [isMobile]);

            const deleteChat = useCallback((chatId, e) => {
                e.stopPropagation();
                setChats(prev => prev.filter(c => c.id !== chatId));
                if (activeChatId === chatId) {
                    setActiveChatId(null);
                }
            }, [activeChatId]);

            const updateChatTitle = useCallback((chatId, firstMessage) => {
                const title = firstMessage.length > 40 ?
                    firstMessage.substring(0, 40).trim() + '...' :
                    firstMessage.trim();
                setChats(prev => prev.map(c =>
                    c.id === chatId && c.title === 'New Chat' ? { ...c, title } : c
                ));
            }, []);

            const addMessageToChat = useCallback((chatId, message) => {
                setChats(prev => prev.map(c => {
                    if (c.id === chatId) {
                        const updatedMessages = [...c.messages, message];
                        return { ...c, messages: updatedMessages };
                    }
                    return c;
                }));
            }, []);

            const updateLastAssistantMessage = useCallback((chatId, content) => {
                setChats(prev => prev.map(c => {
                    if (c.id === chatId) {
                        const messages = [...c.messages];
                        if (messages.length > 0 && messages[messages.length - 1].role ===
                            'assistant') {
                            messages[messages.length - 1] = {
                                ...messages[messages.length - 1],
                                content: content,
                            };
                        }
                        return { ...c, messages };
                    }
                    return c;
                }));
            }, []);

            const saveSettings = useCallback((newApiKey, newModel) => {
                const updated = { apiKey: newApiKey, model: newModel };
                setSettings(updated);
                saveToStorage(chats, updated);
                setSettingsOpen(false);
            }, [chats]);

            return ( <
                div className = "flex h-screen w-screen overflow-hidden bg-main text-gray-100" > { /* Mobile overlay */ } {
                    isMobile && ( <
                        div className = { `sidebar-overlay ${sidebarOpen ? 'open' : ''}` }
                        onClick = {
                            () => setSidebarOpen(false) }
                        />
                    )
                }

                { /* Sidebar */ } <
                Sidebar chats = { chats }
                activeChatId = { activeChatId }
                sidebarOpen = { sidebarOpen }
                isMobile = { isMobile }
                onNewChat = { createNewChat }
                onSelectChat = {
                    (id) => { setActiveChatId(id); if (isMobile) setSidebarOpen(false); } }
                onDeleteChat = { deleteChat }
                onClose = { () => setSidebarOpen(false) }
                />

                { /* Main Area */ } <
                div className = "flex-1 flex flex-col min-w-0 relative" > { /* Top Bar */ } <
                TopBar sidebarOpen = { sidebarOpen }
                onToggleSidebar = { () => setSidebarOpen(prev => !prev) }
                onOpenSettings = { () => setSettingsOpen(true) }
                activeChat = { activeChat }
                />

                { /* Content */ } {
                    activeChat ? ( <
                        ChatView chat = { activeChat }
                        settings = { settings }
                        onAddMessage = { addMessageToChat }
                        onUpdateTitle = { updateChatTitle }
                        onUpdateAssistant = { updateLastAssistantMessage }
                        />
                    ) : ( <
                        HomeScreen onNewChat = { createNewChat }
                        settings = { settings }
                        onAddMessage = { addMessageToChat }
                        onUpdateTitle = { updateChatTitle }
                        onUpdateAssistant = { updateLastAssistantMessage }
                        onSetActiveChat = { setActiveChatId }
                        />
                    )
                }

                { /* Settings Modal */ } {
                    settingsOpen && ( <
                        SettingsModal settings = { settings }
                        onSave = { saveSettings }
                        onClose = { () => setSettingsOpen(false) }
                        />
                    )
                } <
                /div> <
                /div>
            );
        }

        // ============ SIDEBAR ============
        function Sidebar({ chats, activeChatId, sidebarOpen, isMobile, onNewChat, onSelectChat, onDeleteChat,
            onClose }) {
            const sidebarRef = useRef(null);

            const sidebarClasses = isMobile ?
                `sidebar-mobile ${sidebarOpen ? 'open' : ''} w-72 bg-sidebar flex flex-col h-full shadow-2xl` :
                `sidebar-transition ${sidebarOpen ? 'w-72' : 'w-0 opacity-0 pointer-events-none'} bg-sidebar flex flex-col h-full shadow-xl overflow-hidden`;

            return ( <
                div ref = { sidebarRef }
                className = { sidebarClasses } >
                <
                div className = "flex items-center justify-between p-4 border-b border-gray-700/50 flex-shrink-0" >
                <
                span className = "font-semibold text-sm text-gray-200 tracking-wide" > Chat History < /span> <
                div className = "flex items-center gap-1" >
                <
                button onClick = { onNewChat }
                className = "p-1.5 rounded-lg hover:bg-gray-700/60 transition-colors text-gray-400 hover:text-white"
                title = "New Chat" >
                <
                Icons.Plus className = "w-4 h-4" / >
                <
                /button> {
                    isMobile && ( <
                        button onClick = { onClose }
                        className = "p-1.5 rounded-lg hover:bg-gray-700/60 transition-colors text-gray-400 hover:text-white" >
                        <
                        Icons.Close className = "w-4 h-4" / >
                        <
                        /button>
                    )
                } <
                /div> <
                /div> <
                div className = "flex-1 overflow-y-auto scrollbar-thin py-2 px-2 space-y-1" > {
                    chats.length === 0 ? ( <
                        div className = "text-center text-gray-500 text-xs py-8 px-4" >
                        No conversations yet.Start a new chat! <
                        /div>
                    ) : (
                        chats.map(chat => ( <
                            div key = { chat.id }
                            onClick = { () => onSelectChat(chat.id) }
                            className = { `group flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer transition-all text-sm ${activeChatId === chat.id ? 'bg-gray-700/70 text-white' : 'text-gray-300 hover:bg-gray-700/40 hover:text-white'}` } >
                            <
                            span className = "flex-1 truncate text-xs" > { chat.title } < /span> <
                            button onClick = {
                                (e) => onDeleteChat(chat.id, e) }
                            className = "opacity-0 group-hover:opacity-100 p-1 rounded-md hover:bg-red-500/20 text-gray-500 hover:text-red-400 transition-all flex-shrink-0"
                            title = "Delete chat" >
                            <
                            Icons.Trash className = "w-3.5 h-3.5" / >
                            <
                            /button> <
                            /div>
                        ))
                    )
                } <
                /div> <
                div className = "p-3 border-t border-gray-700/50 flex-shrink-0" >
                <
                div className = "text-xs text-gray-500 text-center" >

            // ============ CHAT VIEW ============
            function ChatView({ chat, settings, onAddMessage, onUpdateTitle, onUpdateAssistant }) {
                const [inputValue, setInputValue] = useState('');
                const [uploadedImage, setUploadedImage] = useState(null);
                const [isLoading, setIsLoading] = useState(false);
                const messagesEndRef = useRef(null);
                const imageInputRef = useRef(null);
                const hasSentInitial = useRef(false);

                const messages = chat?.messages || [];

                // Auto-scroll to bottom
                useEffect(() => {
                    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
                }, [messages, isLoading]);

                // Handle pending chat from home screen
                useEffect(() => {
                    if (window._pendingNewChat && window._pendingNewChat.id === chat?.id && !hasSentInitial
                        .current) {
                        hasSentInitial.current = true;
                        const pendingChat = window._pendingNewChat;
                        window._pendingNewChat = null;
                        // The chat needs to exist with its first message
                        // We send the AI request for the first message
                        if (pendingChat.messages.length > 0) {
                            const firstMsg = pendingChat.messages[0];
                            sendToAI(firstMsg.content, firstMsg.image, chat.id, pendingChat.messages);
                        }
                    }
                }, [chat?.id]);

                const sendToAI = useCallback(async (text, image, chatId, currentMessages) => {
                    if (!settings.apiKey) {
                        const errorMsg = {
                            role: 'assistant',
                            content: '⚠️ Please configure your OpenRouter API key in Settings (gear icon) to start chatting.',
                            timestamp: Date.now(),
                        };
                        onAddMessage(chatId, errorMsg);
                        return;
                    }

                    setIsLoading(true);

                    // Build the user message
                    const userMsg = {
                        role: 'user',
                        content: text || 'Analyze this image',
                        image: image,
                        timestamp: Date.now(),
                    };

                    // Add user message
                    onAddMessage(chatId, userMsg);

                    // Update title if this is the first message
                    if (currentMessages.length === 0) {
                        onUpdateTitle(chatId, text || 'Image analysis');
                    }

                    // Add placeholder assistant message
                    const assistantMsg = {
                        role: 'assistant',
                        content: '',
                        timestamp: Date.now(),
                    };
                    onAddMessage(chatId, assistantMsg);

                    // Build API request payload
                    const modelInfo = getModelInfo(settings.model);
                    const messagesForAPI = [];

                    // Add all previous messages (excluding the placeholder assistant message)
                    const allMsgs = [...currentMessages, userMsg];
                    for (const msg of allMsgs) {
                        if (msg.role === 'user') {
                            if (msg.image) {
                                messagesForAPI.push({
                                    role: 'user',
                                    content: [
                                        { type: 'text', text: msg.content || 'Analyze this image' },
                                        { type: 'image_url', image_url: { url: msg.image } },
                                    ],
                                });
                            } else {
                                messagesForAPI.push({
                                    role: 'user',
                                    content: msg.content,
                                });
                            }
                        } else if (msg.role === 'assistant' && msg.content) {
                            messagesForAPI.push({
                                role: 'assistant',
                                content: msg.content,
                            });
                        }
                    }

                    // If the user uploaded an image but the model doesn't support vision, warn
                    if (image && modelInfo && !modelInfo.vision) {
                        const warningMsg = {
                            role: 'assistant',
                            content: '⚠️ **Note:** The selected model (' + modelInfo.name +
                                ') does not support vision/image analysis. The image was sent but may be ignored. Consider switching to a vision-capable model like GPT-4o, Claude 3.5 Sonnet, or Gemini Flash.',
                            timestamp: Date.now(),
                        };
                        // Replace the placeholder
                        onUpdateAssistant(chatId, warningMsg.content);
                        // Still try to send
                    }

                    try {
                        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${settings.apiKey}`,
                                'HTTP-Referer': window.location.origin,
                                'X-Title': 'UMAIR AI STUDIO',
                            },
                            body: JSON.stringify({
                                model: settings.model,
                                messages: messagesForAPI,
                                stream: true,
                                max_tokens: 4096,
                            }),
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(
                                errorData.error?.message || `API Error: ${response.status} ${response.statusText}`
                            );
                        }

                        // Handle streaming response
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let fullContent = '';
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || '';

                            for (const line of lines) {
                                const trimmed = line.trim();
                                if (trimmed.startsWith('data: ')) {
                                    const dataStr = trimmed.substring(6);
                                    if (dataStr === '[DONE]') continue;
                                    try {
                                        const parsed = JSON.parse(dataStr);
                                        const delta = parsed?.choices?.[0]?.delta?.content;
                                        if (delta) {
                                            fullContent += delta;
                                            onUpdateAssistant(chatId, fullContent);
                                        }
                                    } catch (e) { /* skip malformed JSON */ }
                                }
                            }
                        }

                        // If no content was received
                        if (!fullContent) {
                            onUpdateAssistant(chatId,
                                'No response received. The model may not support this type of request.');
                        }
                    } catch (error) {
                        console.error('API Error:', error);
                        onUpdateAssistant(chatId, `❌ **Error:** ${error.message}\n\nPlease check your API key and try again.`
                        );
                    } finally {
                        setIsLoading(false);
                    }
                }, [settings, onAddMessage, onUpdateTitle, onUpdateAssistant]);

                const handleSend = useCallback((text, image) => {
                    if (!text.trim() && !image) return;
                    if (isLoading) return;
                    sendToAI(text, image, chat.id, messages);
                    setInputValue('');
                    setUploadedImage(null);
                }, [isLoading, sendToAI, chat?.id, messages]);

                const handleImageUpload = useCallback((e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;

                    // Check file size (max ~8MB)
                    if (file.size > 8 * 1024 * 1024) {
                        alert('Image size should be less than 8MB.');
                        return;
                    }

                    // Check file type
                    if (!file.type.startsWith('image/')) {
                        alert('Please select an image file.');
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setUploadedImage(event.target.result);
                    };
                    reader.readAsDataURL(file);

                    // Reset input
                    if (imageInputRef.current) {
                        imageInputRef.current.value = '';
                    }
                }, []);

                return ( <
                    div className = "flex-1 flex flex-col min-h-0 relative" > { /* Messages Area */ } <
                    div className = "flex-1 overflow-y-auto scrollbar-thin px-4 py-6" >
                    <
                    div className = "max-w-3xl mx-auto space-y-5" > {
                        messages.length === 0 && !isLoading ? ( <
                            div className = "text-center text-gray-500 py-20" >
                            <
                            p className = "text-lg" > Start a conversation < /p> <
                            p className = "text-sm mt-2" > Type a message below or upload an image
                            for analysis. < /p> <
                            /div>
                        ) : (
                            messages.map((msg, index) => ( <
                                MessageBubble key = { index }
                                message = { msg }
                                isLast = { index === messages.length - 1 }
                                isLoading = { isLoading && index === messages.length - 1 && msg.role ===
                                    'assistant' && !msg.content }
                                />
                            ))
                        )
                    } {
                        isLoading && messages.length > 0 && messages[messages.length - 1]?.role === 'assistant' &&
                            messages[messages.length - 1]?.content && ( <
                                div className = "flex items-center gap-2 text-gray-500 pl-1" >
                                <
                                span className = "text-xs" > Generating < /span> <
                                span className = "flex gap-1" >
                                <
                                span className = "w-1.5 h-1.5 bg-gray-500 rounded-full pulse-dot" > < /span> <
                                span className = "w-1.5 h-1.5 bg-gray-500 rounded-full pulse-dot" > < /span> <
                                span className = "w-1.5 h-1.5 bg-gray-500 rounded-full pulse-dot" > < /span> <
                                /span> <
                                /div>
                            )
                    } <
                    div ref = { messagesEndRef }
                    /> <
                    /div> <
                    /div>

                    { /* Input Area */ } <
                    div className = "flex-shrink-0 px-4 pb-4 pt-2" >
                    <
                    div className = "max-w-3xl mx-auto" >
                    <
                    ChatInput value = { inputValue }
                    onChange = { setInputValue }
                    onSend = { handleSend }
                    isLoading = { isLoading }
                    uploadedImage = { uploadedImage }
                    onImageUpload = { handleImageUpload }
                    onImageRemove = { () => setUploadedImage(null) }
                    imageInputRef = { imageInputRef }
                    placeholder = "Message UMAIR AI..."
                    disabled = { isLoading }
                    /> <
                    /div> <
                    /div> <
                    /div>
                );
            }

            // ============ MESSAGE BUBBLE ============
            function MessageBubble({ message, isLast, isLoading }) {
                const isUser = message.role === 'user';
                const isAssistant = message.role === 'assistant';

                if (isLoading && isAssistant && !message.content) {
                    return ( <

                        <
                        div className = "w-8 h-8 rounded-full bg-gradient-to-br from-accent to-emerald-400 flex items-center justify-center flex-shrink-0 shadow-md" >
                        <
                        Icons.Sparkle className = "w-4 h-4 text-white" / >
                        <
                        /div> <
                        div className = "flex items-center gap-2 py-3 px-4 rounded-2xl bg-gray-700/30" >
                        <
                        span className = "flex gap-1.5" >
                        <

                }

                return ( <
                    div className = { `flex items-start gap-3 animate-fade-in ${isUser ? 'flex-row-reverse' : ''}` } >
                    { /* Avatar */ } {
                        isUser ? ( <
                            div className =
                            "w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center flex-shrink-0 text-sm font-semibold text-gray-200" >
                            U <
                            /div>
                        ) : ( <
                            div className =
                            "w-8 h-8 rounded-full bg-gradient-to-br from-accent to-emerald-400 flex items-center justify-center flex-shrink-0 shadow-md" >
                            <
                            Icons.Sparkle className = "w-4 h-4 text-white" / >
                            <
                            /div>
                        )
                    }

                    { /* Content */ } <
                    div className = { `max-w-[75%] sm:max-w-[70%] ${isUser ? 'text-right' : 'text-left'}` } >
                    { /* Image preview for user messages */ } {
                        message.image && ( <
                            div className = { `${isUser ? 'ml-auto' : ''} mb-2 max-w-[280px] sm:max-w-[320px]` } >
                            <
                            img src = { message.image }
                            alt = "Uploaded"
                            className = "rounded-xl border border-gray-600/50 shadow-lg w-full h-auto max-h-60 object-contain bg-gray-800/50" /
                            >
                            <
                            /div>
                        )
                    }

                    { /* Text bubble */ } {
                        message.content && ( <
                            div className = { `inline-block px-4 py-3 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap break-words ${isUser ? 'bg-bubble text-gray-100 rounded-tr-md' : 'bg-gray-700/40 text-gray-100 rounded-tl-md'}` }
                            dangerouslySetInnerHTML = {
                                { __html: formatMessageContent(message.content) } }
                            />
                        )
                    } <
                    /div> <
                    /div>
                );
            }

            function formatMessageContent(content) {
                if (!content) return '';
                // Simple markdown-like formatting
                let formatted = content
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-white">$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`{3}(\w*)\n?([\s\S]*?)`{3}/g,
                        '<pre class="bg-gray-800/80 rounded-lg p-3 my-2 overflow-x-auto text-xs"><code class="text-gray-200">$2</code></pre>'
                        )
                    .replace(/`([^`]+)`/g,
                        '<code class="bg-gray-800/80 px-1.5 py-0.5 rounded text-xs text-accent">$1</code>')
                    .replace(/\n/g, '<br/>');
                return formatted;
            }

            // ============ SETTINGS MODAL ============
            function SettingsModal({ settings, onSave, onClose }) {
                const [apiKey, setApiKey] = useState(settings.apiKey || '');
                const [model, setModel] = useState(settings.model || DEFAULT_MODEL);
                const [showKey, setShowKey] = useState(false);

                const handleSave = useCallback(() => {

                }, [apiKey, model, onSave]);

                const selectedModelInfo = getModelInfo(model);

                return ( <
                    div className = "fixed inset-0 z-50 flex items-center justify-center p-4"
                    onClick = { (e) => { if (e.target === e.currentTarget) onClose(); } } >
                    <
                    div className = "absolute inset-0 bg-black/70 backdrop-blur-sm" > < /div> <
                    div className =
                    "relative bg-[#1a1a1a] border border-gray-700/50 rounded-2xl shadow-2xl w-full max-w-md p-6 animate-fade-in z-10" >
                    <
                    div className = "flex items-center justify-between mb-6" >
                    <
                    h2 className = "text-lg font-semibold text-white flex items-center gap-2" >
                    <
                    Icons.Gear className = "w-5 h-5 text-gray-400" / >
                    Settings
                    <
                    /h2> <
                    button onClick = { onClose }
                    className = "p-1.5 rounded-lg hover:bg-gray-700/50 transition-colors text-gray-400 hover:text-white" >
                    <
                    Icons.Close className = "w-5 h-5" / >
                    <
                    /button> <
                    /div>

                    { /* API Key Input */ } <
                    div className = "mb-5" >
                    <
                    label className = "block text-sm font-medium text-gray-300 mb-2" >
                    OpenRouter API Key
                    <
                    /label> <
                    div className = "relative" >
                    <
                    input type = { showKey ? 'text' : 'password' }
                    value = { apiKey }
                    onChange = { (e) => setApiKey(e.target.value) }
                    placeholder = "sk-or-v1-..."
                    className =
                        "w-full bg-input border border-gray-600/40 rounded-xl px-4 py-3 pr-12 text-sm text-gray-100 placeholder-gray-500 outline-none focus:border-accent/60 focus:ring-1 focus:ring-accent/30 transition-all"
                    />
                    <
                    button onClick = { () => setShowKey(!showKey) }
                    className = "absolute right-3 top-1/2 -translate-y-1/2 p-1 rounded-md hover:bg-gray-600/40 transition-colors text-gray-400 hover:text-white"
                    title = { showKey ? 'Hide API key' : 'Show API key' } >
                    <
                    Icons.Eye className = "w-4 h-4" / >
                    <
                    /button> <
                    /div> <
                    p className = "text-xs text-gray-500 mt-1.5" >
                    Get your API key at{ ' ' } <
                    a href = "https://openrouter.ai/keys"
                    target = "_blank"
                    rel = "noopener noreferrer"
                    className = "text-accent hover:underline" > openrouter.ai / keys < /a>
                        <
                        /p> <
                        /div>

                        { /* Model Selector */ } <
                        div className = "mb-6" >
                        <
                        label className = "block text-sm font-medium text-gray-300 mb-2" >
                        AI Model
                        <
                        /label> <
                        select value = { model }
                        onChange = { (e) => setModel(e.target.value) }
                        className =
                            "w-full bg-input border border-gray-600/40 rounded-xl px-4 py-3 text-sm text-gray-100 outline-none focus:border-accent/60 focus:ring-1 focus:ring-accent/30 transition-all appearance-none cursor-pointer"
                        >
                        {
                            AVAILABLE_MODELS.map(m => ( <
                                option key = { m.id }
                                value = { m.id } > { m.name } ({ m.provider }) { m.vision ? ' 👁️' : '' } <
                                /option>
                            ))
                        } <
                        /select> {
                            selectedModelInfo && ( <
                                div className = "flex items-center gap-2 mt-2 text-xs text-gray-500" > {
                                    selectedModelInfo.vision ? ( <
                                        span className =
                                        "inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-green-500/10 text-green-400 border border-green-500/20" >
                                        <
                                        span > 👁️ < /span> Vision capable <
                                        /span>
                                    ) : ( <
                                        span className =
                                        "inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/20" >
                                        <
                                        span > ⚠️ < /span> Text only <
                                        /span>
                                    )
                                } <
                                span > •Supported by OpenRouter < /span> <
                                /div>
                            )
                        } <
                        /div>

                        { /* Save Button */ } <
                        button onClick = { handleSave }
                        className = { `w-full py-3 rounded-xl font-medium text-sm transition-all shadow-lg ${saved ? 'bg-green-600 text-white' : 'bg-accent text-white hover:bg-accent-hover shadow-accent/20'}` } >
                        { saved ? '✓ Settings Saved!' : 'Save Settings' } <
                        /button>

                        { /* Note */ } <
                        p className = "text-xs text-gray-500 text-center mt-4" >
                        Settings are stored locally in your browser. <
                        /p> <
                        /div> <
                        /div>
                    );
                }

                // ============ RENDER ============
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render( < App / > );
    </script>
</body>
</html>
