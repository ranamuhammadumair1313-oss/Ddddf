<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umair AI Studio — Groq</title>
    <style>
        /* ─────────── GLOBAL VARIABLES & RESET ─────────── */
        :root {
            --bg: #fafaf8;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #5e5e5e;
            --text-tertiary: #8a8a8a;
            --border: #e5e5e2;
            --border-light: #f0f0ed;
            --ai-bubble: #f4f4f1;
            --user-bubble: #1a1a1a;
            --user-text: #ffffff;
            --accent: #2c2c2c;
            --accent-hover: #1a1a1a;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.1);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --success: #2e7d32;
            --danger: #c62828;
            --warning: #e65100;
        }
        body.dark {
            --bg: #1a1a1a;
            --surface: #2a2a2a;
            --text: #f0f0f0;
            --text-secondary: #b0b0b0;
            --text-tertiary: #888;
            --border: #3a3a3a;
            --border-light: #333;
            --ai-bubble: #2c2c2c;
            --user-bubble: #e0e0e0;
            --user-text: #1a1a1a;
            --accent: #e0e0e0;
            --accent-hover: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        .app-container {
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ─────────── HOME PAGE ─────────── */
        .home-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:40px 24px; }
        .home-page.hidden { display:none; }
        .greeting-section { text-align:center; margin-bottom:32px; }
        .greeting-section h1 { font-size:clamp(1.8rem,4vw,2.6rem); font-weight:600; letter-spacing:-0.02em; color:var(--text); }
        .greeting-section .subtitle { margin-top:6px; font-size:0.95rem; color:var(--text-secondary); }

        /* scientific micro cards grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 840px;
            margin-top: 10px;
        }
        @media (max-width: 900px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 600px) { .cards-grid { grid-template-columns: repeat(3, 1fr); gap:6px; } }
        @media (max-width: 400px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }

        .micro-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 6px;
            cursor: pointer;
            text-align: center;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-height: 80px;
            justify-content: center;
        }
        .micro-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color:#c5c5c2; }
        .micro-card:active { transform:scale(0.96); }
        .micro-card .card-emoji { font-size:1.4rem; line-height:1; }
        .micro-card .card-label { font-size:0.65rem; font-weight:500; color:var(--text); white-space:nowrap; letter-spacing:-0.01em; }
        .settings-trigger {
            position:fixed; bottom:28px; right:28px; width:44px; height:44px; border-radius:50%; background:var(--surface);
            border:1px solid var(--border); cursor:pointer; font-size:1.2rem; display:flex; align-items:center; justify-content:center;
            box-shadow:var(--shadow-md); transition:all var(--transition); z-index:50; color:var(--text-secondary);
        }
        .settings-trigger:hover { box-shadow:var(--shadow-lg); border-color:#c5c5c2; color:var(--text); transform:rotate(30deg); }

        /* ─────────── CHAT PAGE ─────────── */
        .chat-page { display:none; flex-direction:column; height:100vh; background:var(--surface); position:relative; }
        .chat-page.active { display:flex; }
        .chat-header {
            display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border-light);
            background:var(--surface); position:sticky; top:0; z-index:10; flex-shrink:0; flex-wrap:wrap;
        }
        .header-btn {
            background:none; border:1px solid var(--border); border-radius:16px; padding:5px 10px; cursor:pointer;
            font-size:0.75rem; font-weight:500; color:var(--text-secondary); display:flex; align-items:center; gap:4px;
            transition:all var(--transition); font-family:var(--font); white-space:nowrap;
        }
        .header-btn:hover { background:#f5f5f2; color:var(--text); border-color:#c5c5c2; }
        body.dark .header-btn:hover { background:#3a3a3a; }
        .chat-topic-badge { font-size:0.8rem; font-weight:500; color:var(--text); background:#f4f4f1; padding:5px 10px; border-radius:14px; }
        .model-selector { margin-left:auto; display:flex; align-items:center; gap:6px; }
        .model-selector select {
            padding:5px 10px; border-radius:12px; border:1px solid var(--border); background:#fafaf8; font-size:0.7rem;
            color:var(--text); outline:none; cursor:pointer; font-family:var(--font);
        }
        .search-bar { display:flex; align-items:center; gap:4px; border-radius:14px; border:1px solid var(--border); background:#fafaf8; padding:2px 8px; }
        .search-bar input { border:none; background:transparent; outline:none; font-size:0.7rem; width:100px; color:var(--text); }

        .messages-container { flex:1; overflow-y:auto; padding:16px 16px 8px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
        .messages-container::-webkit-scrollbar { width:4px; }
        .messages-container::-webkit-scrollbar-thumb { background:#d5d5d2; border-radius:8px; }
        .empty-hint { text-align:center; color:var(--text-tertiary); font-size:0.85rem; padding:40px 20px; }

        .message { display:flex; flex-direction:column; max-width:85%; animation:msgIn 0.3s ease-out; position:relative; }
        .message.user { align-self:flex-end; }
        .message.assistant { align-self:flex-start; }
        .message .bubble { padding:12px 16px; border-radius:18px; line-height:1.55; font-size:0.9rem; position:relative; }
        .message.user .bubble { background:var(--user-bubble); color:var(--user-text); border-bottom-right-radius:6px; }
        .message.assistant .bubble { background:var(--ai-bubble); color:var(--text); border-bottom-left-radius:6px; border:1px solid var(--border-light); }
        .message .bubble pre { background:rgba(0,0,0,0.05); border-radius:8px; padding:10px; overflow-x:auto; font-size:0.8rem; font-family:'SF Mono',monospace; }
        .message .bubble code { font-family:'SF Mono',monospace; font-size:0.85em; background:rgba(0,0,0,0.06); padding:2px 5px; border-radius:4px; }
        .message-toolbar { display:flex; gap:4px; margin-top:4px; opacity:0; transition:opacity 0.2s; }
        .message:hover .message-toolbar, .message-toolbar.always { opacity:1; }
        .msg-btn {
            background:none; border:1px solid var(--border); border-radius:10px; padding:2px 6px; font-size:0.65rem;
            cursor:pointer; color:var(--text-secondary); transition:all var(--transition);
        }
        .msg-btn:hover { background:#f0f0ed; color:var(--text); }
        body.dark .msg-btn:hover { background:#3a3a3a; }

        .typing-indicator { display:none; align-self:flex-start; padding:14px 18px; background:var(--ai-bubble); border-radius:18px; border:1px solid var(--border-light); gap:5px; align-items:center; }
        .typing-indicator.visible { display:flex; }
        .typing-dot { width:7px; height:7px; border-radius:50%; background:#b0b0ab; animation:typingBounce 1.4s infinite; }
        .typing-dot:nth-child(2){ animation-delay:0.2s; } .typing-dot:nth-child(3){ animation-delay:0.4s; }
        @keyframes typingBounce { 0%,60%,100%{ transform:translateY(0); opacity:0.35; } 30%{ transform:translateY(-7px); opacity:1; } }
        @keyframes msgIn { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

        .chat-input-area { padding:10px 16px 16px; border-top:1px solid var(--border-light); background:var(--surface); display:flex; gap:8px; align-items:flex-end; }
        .chat-input-area textarea { flex:1; resize:none; border:1px solid var(--border); border-radius:18px; padding:10px 16px; font-size:0.9rem; font-family:var(--font); line-height:1.5; outline:none; background:#fafaf8; color:var(--text); max-height:130px; min-height:40px; }
        .send-btn,.stop-btn { width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; font-size:1rem; transition:all var(--transition); display:flex; align-items:center; justify-content:center; }
        .send-btn { background:var(--accent); color:#fff; } .send-btn:hover { background:var(--accent-hover); } .send-btn:disabled { opacity:0.4; }
        .stop-btn { background:#e0e0e0; color:#333; display:none; } .stop-btn.visible { display:flex; }

        /* Modals */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:100; align-items:center; justify-content:center; backdrop-filter:blur(3px); }
        .modal-overlay.active { display:flex; }
        .modal { background:var(--surface); border-radius:var(--radius-lg); padding:24px; width:90%; max-width:420px; box-shadow:var(--shadow-xl); border:1px solid var(--border); animation:modalIn 0.3s; }
        @keyframes modalIn { from{ opacity:0; transform:translateY(20px) scale(0.95); } to{ opacity:1; transform:translateY(0) scale(1); } }
        .modal h2 { font-size:1.2rem; margin-bottom:8px; } .modal .sub { font-size:0.8rem; color:var(--text-secondary); margin-bottom:16px; }
        .modal label { display:block; font-size:0.8rem; margin-bottom:4px; } .modal input, .modal select { width:100%; padding:10px; border:1px solid var(--border); border-radius:10px; margin-bottom:12px; font-size:0.85rem; background:#fafaf8; }
        .modal .btn-row { display:flex; gap:8px; } .modal .btn { flex:1; padding:10px; border-radius:10px; font-size:0.85rem; cursor:pointer; border:1px solid transparent; }
        .btn-primary { background:var(--accent); color:#fff; } .btn-secondary { background:transparent; color:var(--text-secondary); border-color:var(--border); }

        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:#1a1a1a; color:#fff; padding:12px 22px; border-radius:24px; font-size:0.8rem; z-index:200; transition:transform 0.35s; pointer-events:none; max-width:90vw; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .toast.error { background:#c0392b; }
    </style>
</head>
<body>
<div class="app-container">
    <!-- HOME PAGE -->
    <div class="home-page" id="homePage">
        <div class="greeting-section">
            <h1>Hello, I'm Umair AI Studio <span>👋</span></h1>
            <p class="subtitle">Pick a scientific domain to start</p>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
        <button class="settings-trigger" id="settingsTrigger">⚙️</button>
    </div>

    <!-- CHAT PAGE -->
    <div class="chat-page" id="chatPage">
        <div class="chat-header">
            <button class="header-btn" id="backBtn">← Home</button>
            <button class="header-btn" id="clearChatBtn">🗑️ Clear</button>
            <button class="header-btn" id="sessionsBtn">📂 Sessions</button>
            <span class="chat-topic-badge" id="chatTopicBadge">Topic</span>
            <div class="search-bar"><input type="text" id="searchInput" placeholder="Search..."></div>
            <div class="model-selector">
                <select id="modelSelect"></select>
                <span id="modelStatusDot" style="width:8px;height:8px;border-radius:50%;background:#4caf50;"></span>
            </div>
            <button class="header-btn" id="darkToggle">🌓</button>
        </div>
        <div class="messages-container" id="messagesContainer"><div class="empty-hint">Type a message to begin</div></div>
        <div class="typing-indicator" id="typingIndicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
        <div class="chat-input-area">
            <textarea id="chatInput" rows="1" placeholder="Message..."></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
            <button class="stop-btn" id="stopBtn">■</button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>⚙️ Settings</h2>
            <p class="sub">Enter your Groq API key (starts with gsk_).</p>
            <label>API Key</label>
            <input type="password" id="apiKeyInput" placeholder="gsk_...">
            <div class="btn-row">
                <button class="btn btn-secondary" id="testKeyBtn">Test Key</button>
                <button class="btn btn-primary" id="saveApiKeyBtn">Save</button>
            </div>
            <button class="btn btn-secondary" style="margin-top:8px;width:100%;" id="closeModalBtn">Cancel</button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>
</div>

<script>
(function() {
    // ─── Groq models fallback order ───
    const GROQ_MODELS = [
        { id: 'llama3-70b-8192', name: 'Llama 3 70B' },
        { id: 'mixtral-8x7b-32768', name: 'Mixtral 8x7B' },
        { id: 'gemma2-9b-it', name: 'Gemma 2 9B' },
        { id: 'llama3-8b-8192', name: 'Llama 3 8B' },
        { id: 'gemma-7b-it', name: 'Gemma 7B' }
    ];

    // scientific topic cards (24 items)
    const TOPICS = [
        { emoji:'🔢', label:'Algebra' }, { emoji:'📐', label:'Geometry' }, { emoji:'📊', label:'Statistics' },
        { emoji:'🧮', label:'Calculus' }, { emoji:'🔬', label:'Biology' }, { emoji:'🧪', label:'Chemistry' },
        { emoji:'⚛️', label:'Physics' }, { emoji:'🌌', label:'Astronomy' }, { emoji:'🌍', label:'Geology' },
        { emoji:'🧠', label:'Neuroscience' }, { emoji:'💻', label:'Computer Sci' }, { emoji:'🤖', label:'AI & ML' },
        { emoji:'🔧', label:'Engineering' }, { emoji:'🧬', label:'Genetics' }, { emoji:'💊', label:'Medicine' },
        { emoji:'🌱', label:'Ecology' }, { emoji:'📡', label:'Telecom' }, { emoji:'💡', label:'Innovation' },
        { emoji:'📈', label:'Econometrics' }, { emoji:'🧲', label:'Electromagnetism' }, { emoji:'🔭', label:'Telescopy' },
        { emoji:'🧫', label:'Microbiology' }, { emoji:'⚡', label:'Energy' }, { emoji:'📝', label:'Ask Anything' }
    ];

    const STORAGE_KEY = 'umair_groq_key_enc';
    const SETTINGS_KEY = 'umair_groq_settings';
    const SESSIONS_KEY = 'umair_groq_sessions';

    let apiKey = '';
    let currentModelIndex = 0;
    let messages = [];
    let isGenerating = false;
    let abortController = null;
    let currentTopic = null;
    let currentSessionId = null;
    let sessions = {};

    // DOM elements
    const $ = (sel) => document.querySelector(sel);
    const dom = {
        homePage: $('#homePage'), chatPage: $('#chatPage'), cardsGrid: $('#cardsGrid'),
        chatTopicBadge: $('#chatTopicBadge'), messagesContainer: $('#messagesContainer'),
        emptyHint: $('.empty-hint'), typingIndicator: $('#typingIndicator'),
        chatInput: $('#chatInput'), sendBtn: $('#sendBtn'), stopBtn: $('#stopBtn'),
        backBtn: $('#backBtn'), clearChatBtn: $('#clearChatBtn'), sessionsBtn: $('#sessionsBtn'),
        searchInput: $('#searchInput'), modelSelect: $('#modelSelect'), modelStatusDot: $('#modelStatusDot'),
        darkToggle: $('#darkToggle'), settingsTrigger: $('#settingsTrigger'),
        modalOverlay: $('#modalOverlay'), apiKeyInput: $('#apiKeyInput'),
        testKeyBtn: $('#testKeyBtn'), saveApiKeyBtn: $('#saveApiKeyBtn'), closeModalBtn: $('#closeModalBtn'),
        toast: $('#toast')
    };

    // ─── Encryption helpers ───
    function encryptKey(key) { return btoa(key.split('').reverse().join('') + 'umair'); }
    function decryptKey(enc) { try { return atob(enc).replace('umair','').split('').reverse().join(''); } catch(e) { return ''; } }
    function loadApiKey() { const e = localStorage.getItem(STORAGE_KEY); if(e) apiKey = decryptKey(e); return apiKey; }
    function saveApiKeyToStorage(key) { localStorage.setItem(STORAGE_KEY, encryptKey(key)); apiKey = key; }

    function loadSettings() {
        const s = localStorage.getItem(SETTINGS_KEY);
        if(s) { try { const p=JSON.parse(s); currentModelIndex = p.modelIndex||0; if(p.dark) document.body.classList.add('dark'); } catch{} }
    }
    function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify({modelIndex:currentModelIndex, dark:document.body.classList.contains('dark')})); }
    function loadSessions() { const s=localStorage.getItem(SESSIONS_KEY); sessions = s ? JSON.parse(s) : {}; }
    function saveSessions() { localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }

    function getCurrentModel() { return GROQ_MODELS[currentModelIndex] || GROQ_MODELS[0]; }
    function updateModelUI() {
        dom.modelSelect.value = currentModelIndex;
        dom.modelStatusDot.style.background = '#4caf50';
    }

    // ─── Build topic cards ───
    function buildCards() {
        dom.cardsGrid.innerHTML = '';
        TOPICS.forEach(t => {
            const card = document.createElement('div');
            card.className = 'micro-card';
            card.innerHTML = `<span class="card-emoji">${t.emoji}</span><span class="card-label">${t.label}</span>`;
            card.addEventListener('click', () => navigateToChat(t.label));
            dom.cardsGrid.appendChild(card);
        });
    }

    // ─── Model selector population ───
    function populateModelSelect() {
        dom.modelSelect.innerHTML = '';
        GROQ_MODELS.forEach((m,i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = m.name;
            dom.modelSelect.appendChild(opt);
        });
        dom.modelSelect.value = currentModelIndex;
        dom.modelSelect.addEventListener('change', () => {
            currentModelIndex = parseInt(dom.modelSelect.value);
            saveSettings();
            updateModelUI();
        });
    }

    // ─── Navigation ───
    function navigateToChat(topic) {
        if(!apiKey) { showToast('Please set your Groq API key first', true); openSettings(); return; }
        currentTopic = topic;
        currentSessionId = topic + '_' + Date.now();
        messages = [];
        sessions[currentSessionId] = { topic, messages: [], createdAt: Date.now() };
        saveSessions();
        dom.chatTopicBadge.textContent = topic;
        dom.chatPage.classList.add('active');
        dom.homePage.classList.add('hidden');
        dom.chatInput.value = '';
        dom.chatInput.focus();
        dom.typingIndicator.classList.remove('visible');
        renderMessages();
        const greet = `Hello! I'm your ${topic} assistant. How can I help you today?`;
        addMessage('assistant', greet);
    }

    function goHome() {
        dom.chatPage.classList.remove('active');
        dom.homePage.classList.remove('hidden');
        messages = [];
        currentTopic = null;
        currentSessionId = null;
        renderMessages();
    }

    // ─── Message rendering ───
    function renderMessages() {
        dom.messagesContainer.innerHTML = '';
        messages.forEach((m,i) => renderMessage(m,i));
        if(messages.length===0) dom.emptyHint.style.display='block'; else dom.emptyHint.style.display='none';
        scrollToBottom();
    }

    function addMessage(role, content) {
        messages.push({ role, content, id: Date.now()+Math.random() });
        if(currentSessionId) { sessions[currentSessionId].messages = messages; saveSessions(); }
        renderMessage(messages[messages.length-1], messages.length-1);
        dom.emptyHint.style.display='none';
        scrollToBottom();
    }

    function renderMessage(msg, index) {
        const div = document.createElement('div');
        div.className = `message ${msg.role}`;
        div.dataset.index = index;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = formatContent(msg.content);
        const toolbar = document.createElement('div');
        toolbar.className = 'message-toolbar';
        toolbar.innerHTML = `
            <button class="msg-btn copy-btn">📋</button>
            <button class="msg-btn del-btn">🗑️</button>
            ${msg.role==='assistant' && index===messages.length-1 && !isGenerating ? '<button class="msg-btn regen-btn">🔄</button>' : ''}
        `;
        div.appendChild(bubble);
        div.appendChild(toolbar);
        dom.messagesContainer.appendChild(div);
        div.querySelector('.copy-btn')?.addEventListener('click',()=>{ navigator.clipboard.writeText(msg.content); showToast('Copied!'); });
        div.querySelector('.del-btn')?.addEventListener('click',()=> deleteMessage(index));
        div.querySelector('.regen-btn')?.addEventListener('click',()=> regenerateResponse());
    }

    function deleteMessage(index) {
        messages.splice(index,1);
        if(currentSessionId) { sessions[currentSessionId].messages=messages; saveSessions(); }
        renderMessages();
    }

    function regenerateResponse() {
        const lastUserIdx = messages.map((m,i)=>m.role==='user'?i:-1).filter(i=>i>=0).pop();
        if(lastUserIdx===undefined) return;
        messages = messages.slice(0, lastUserIdx);
        if(currentSessionId) { sessions[currentSessionId].messages=messages; saveSessions(); }
        renderMessages();
        const userMsg = messages[lastUserIdx]?.content;
        if(userMsg) { dom.chatInput.value = userMsg; sendMessage(); }
    }

    function scrollToBottom() { requestAnimationFrame(()=>{ dom.messagesContainer.scrollTop = dom.messagesContainer.scrollHeight; }); }

    function formatContent(text) {
        let escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        escaped = escaped.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,lang,code)=>`<pre><code>${code.trim()}</code></pre>`);
        escaped = escaped.replace(/`([^`]+)`/g,'<code>$1</code>');
        escaped = escaped.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
        escaped = escaped.replace(/\*([^*]+)\*/g,'<em>$1</em>');
        return escaped.replace(/\n/g,'<br>');
    }

    // ─── API call with streaming, fallback, retry ───
    async function sendMessage(retries=0) {
        const userText = dom.chatInput.value.trim();
        if(!userText || isGenerating) return;
        if(!apiKey) { showToast('Set API key first',true); openSettings(); return; }
        dom.chatInput.value = ''; dom.chatInput.style.height='auto';
        addMessage('user', userText);
        dom.typingIndicator.classList.add('visible');
        isGenerating = true; dom.sendBtn.disabled = true; dom.stopBtn.classList.add('visible');
        abortController = new AbortController();

        const systemPrompt = `You are a helpful assistant specialized in ${currentTopic}. Provide accurate, detailed, and scientific answers.`;
        const apiMessages = [{role:'system',content:systemPrompt}, ...messages.slice(-30)];

        const tryRequest = async (modelObj) => {
            const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method:'POST',
                headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${apiKey}` },
                body: JSON.stringify({ model: modelObj.id, messages: apiMessages, stream:true, temperature:0.7, max_tokens:2048 }),
                signal: abortController.signal
            });
            if(!resp.ok) {
                const err = await resp.json().catch(()=>({}));
                const msg = err.error?.message || resp.statusText;
                if(resp.status===429||resp.status===503||resp.status===500) throw {retryable:true, message:msg};
                throw {retryable:false, message:msg};
            }
            return resp;
        };

        try {
            let response;
            let modelIdx = currentModelIndex;
            let attempt = 0;
            while(attempt <= 2) {
                try {
                    response = await tryRequest(GROQ_MODELS[modelIdx]);
                    break;
                } catch(e) {
                    if(e.retryable && attempt < 2) { attempt++; await new Promise(r=>setTimeout(r,1000*attempt)); continue; }
                    else if(e.retryable && modelIdx < GROQ_MODELS.length-1) {
                        modelIdx++; currentModelIndex = modelIdx; saveSettings(); updateModelUI();
                        showToast(`Switched to ${getCurrentModel().name}`, false);
                        attempt = 0; continue;
                    } else throw e;
                }
            }

            dom.typingIndicator.classList.remove('visible');
            const assistDiv = document.createElement('div'); assistDiv.className='message assistant';
            const bubble = document.createElement('div'); bubble.className='bubble'; assistDiv.appendChild(bubble);
            dom.messagesContainer.appendChild(assistDiv);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let full='', buf='';
            while(true) {
                const {done,value}=await reader.read();
                if(done) break;
                buf += decoder.decode(value,{stream:true});
                const lines = buf.split('\n'); buf=lines.pop()||'';
                for(const line of lines) {
                    if(!line.trim()||!line.startsWith('data: ')) continue;
                    const d=line.slice(6); if(d==='[DONE]') continue;
                    try{ const j=JSON.parse(d); const delta=j.choices?.[0]?.delta?.content; if(delta){ full+=delta; bubble.innerHTML=formatContent(full); scrollToBottom(); } } catch{}
                }
            }
            if(!full) full='(empty response)';
            messages.push({role:'assistant',content:full,id:Date.now()});
            if(currentSessionId) { sessions[currentSessionId].messages=messages; saveSessions(); }
            const toolbar = document.createElement('div'); toolbar.className='message-toolbar';
            toolbar.innerHTML = '<button class="msg-btn copy-btn">📋</button><button class="msg-btn del-btn">🗑️</button><button class="msg-btn regen-btn">🔄</button>';
            assistDiv.appendChild(toolbar);
            assistDiv.querySelector('.copy-btn').addEventListener('click',()=>{ navigator.clipboard.writeText(full); showToast('Copied!'); });
            assistDiv.querySelector('.del-btn').addEventListener('click',()=>deleteMessage(messages.length-1));
            assistDiv.querySelector('.regen-btn').addEventListener('click',regenerateResponse);
            scrollToBottom();
            if(currentModelIndex!==0) { currentModelIndex=0; saveSettings(); updateModelUI(); }
        } catch(e) {
            dom.typingIndicator.classList.remove('visible');
            if(e.name==='AbortError') return;
            let msg = e.message || 'Error';
            showToast('❌ '+msg, true);
        } finally {
            isGenerating=false; dom.sendBtn.disabled=false; dom.stopBtn.classList.remove('visible');
            abortController=null; dom.chatInput.focus();
        }
    }

    function stopGeneration() { if(abortController) abortController.abort(); }

    // ─── Chat actions ───
    function clearChat() { if(confirm('Clear chat?')) { messages=[]; if(currentSessionId) sessions[currentSessionId].messages=[]; saveSessions(); renderMessages(); } }
    function toggleDark() { document.body.classList.toggle('dark'); saveSettings(); }
    function searchMessages() { const q=dom.searchInput.value.toLowerCase(); const all=[...dom.messagesContainer.querySelectorAll('.message')]; all.forEach(m=>m.style.display = m.textContent.toLowerCase().includes(q)?'flex':'none'); }
    function showSessions() {
        const existing=document.getElementById('sessionsDropdown'); if(existing) existing.remove();
        const dd=document.createElement('div'); dd.id='sessionsDropdown';
        dd.style.cssText='position:absolute;top:45px;left:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:var(--shadow-lg);z-index:20;max-height:200px;overflow-y:auto;min-width:200px;';
        const ids=Object.keys(sessions);
        if(!ids.length) dd.innerHTML='<div style="padding:8px;color:var(--text-secondary)">No sessions</div>';
        else ids.forEach(id=>{
            const s=sessions[id]; const d=document.createElement('div'); d.style.cssText='padding:8px;cursor:pointer;border-radius:6px;margin-bottom:4px;color:var(--text);';
            d.textContent=`${s.topic} (${new Date(s.createdAt).toLocaleString()})`;
            d.onclick=()=>{ currentSessionId=id; messages=s.messages; currentTopic=s.topic; dom.chatTopicBadge.textContent=s.topic; renderMessages(); dd.remove(); };
            dd.appendChild(d);
        });
        dom.chatPage.appendChild(dd);
        const close= (e)=>{ if(!dd.contains(e.target) && e.target!==dom.sessionsBtn) { dd.remove(); document.removeEventListener('click',close); } };
        setTimeout(()=>document.addEventListener('click',close),0);
    }

    // ─── Settings modal ───
    function openSettings() { dom.apiKeyInput.value = apiKey; dom.modalOverlay.classList.add('active'); }
    function closeSettings() { dom.modalOverlay.classList.remove('active'); saveSettings(); }
    async function testApiKey() {
        const key=dom.apiKeyInput.value.trim(); if(!key) return showToast('Enter key',true);
        dom.testKeyBtn.disabled=true; dom.testKeyBtn.textContent='Testing...';
        try {
            const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{'Authorization':`Bearer ${key}`}});
            if(r.ok) showToast('✅ Valid key'); else showToast('❌ Invalid',true);
        } catch(e) { showToast('❌ Network error',true); }
        finally { dom.testKeyBtn.disabled=false; dom.testKeyBtn.textContent='Test Key'; }
    }
    function saveApiKey() {
        const key=dom.apiKeyInput.value.trim(); if(!key) return;
        saveApiKeyToStorage(key); closeSettings(); showToast('Key saved');
    }

    // ─── Toast ───
    function showToast(msg, isErr=false) {
        dom.toast.textContent=msg; dom.toast.className='toast'+(isErr?' error':'');
        void dom.toast.offsetWidth; dom.toast.classList.add('show');
        clearTimeout(dom.toast._t); dom.toast._t=setTimeout(()=>dom.toast.classList.remove('show'),3000);
    }

    // ─── Initialize ───
    function init() {
        loadApiKey(); loadSettings(); loadSessions();
        buildCards(); populateModelSelect(); updateModelUI();
        dom.apiKeyInput.value = apiKey || '';

        dom.backBtn.addEventListener('click', goHome);
        dom.clearChatBtn.addEventListener('click', clearChat);
        dom.sessionsBtn.addEventListener('click', showSessions);
        dom.darkToggle.addEventListener('click', toggleDark);
        dom.sendBtn.addEventListener('click', ()=>sendMessage());
        dom.stopBtn.addEventListener('click', stopGeneration);
        dom.chatInput.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });
        dom.chatInput.addEventListener('input', ()=>{ dom.chatInput.style.height='auto'; dom.chatInput.style.height=Math.min(dom.chatInput.scrollHeight,130)+'px'; });
        dom.searchInput.addEventListener('input', searchMessages);
        dom.settingsTrigger.addEventListener('click', openSettings);
        dom.closeModalBtn.addEventListener('click', closeSettings);
        dom.saveApiKeyBtn.addEventListener('click', saveApiKey);
        dom.testKeyBtn.addEventListener('click', testApiKey);
        dom.modalOverlay.addEventListener('click', e=>{ if(e.target===dom.modalOverlay) closeSettings(); });
        document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSettings(); });

        if(!apiKey) setTimeout(()=>{ showToast('⚙️ Set Groq API key to start'); }, 1200);
    }
    init();
})();
</script>
</body>
</html>
