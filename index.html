<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umair AI Studio</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

#loading{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    font-weight:bold;
    z-index:9999;
}

header{
    background:#1f1f1f;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

button{
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#chat{
    height:70vh;
    overflow:auto;
    padding:15px;
}

.message{
    margin:10px 0;
    padding:10px;
    border-radius:10px;
}

.user{
    background:#2563eb;
}

.ai{
    background:#333;
}

.input-box{
    display:flex;
    padding:10px;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
}

#settingsPanel{
    position:fixed;
    top:0;
    right:-100%;
    width:300px;
    height:100%;
    background:#222;
    padding:20px;
    transition:0.3s;
}

#settingsPanel.show{
    right:0;
}
</style>
</head>

<body>

<div id="loading">Umair AI Studio</div>

<header>
    <h2>Umair AI Studio</h2>
    <button onclick="openSettings()">⚙️</button>
</header>

<div id="chat"></div>

<div class="input-box">
    <input id="prompt" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>
</div>

<div id="settingsPanel">
    <h2>Settings</h2>

    <input id="apikey" placeholder="Enter API Key">

    <br><br>

    <button onclick="saveApi()">Save API</button>
</div>

<script>

setTimeout(()=>{
 document.getElementById("loading").style.display="none";
},2000);

function openSettings(){
 document.getElementById("settingsPanel")
 .classList.toggle("show");
}

function saveApi(){
 localStorage.setItem(
   "apiKey",
   document.getElementById("apikey").value
 );
 alert("API Saved");
}

async function sendMessage(){

 const msg=document.getElementById("prompt").value;
 if(!msg) return;

 const chat=document.getElementById("chat");

 chat.innerHTML += `
 <div class="message user">${msg}</div>
 `;

 document.getElementById("prompt").value="";

 const apiKey=localStorage.getItem("apiKey");

 if(!apiKey){
   alert("Add API Key First");
   return;
 }

 try{

 const response=await fetch(
 "YOUR_API_ENDPOINT",
 {
   method:"POST",
   headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+apiKey
   },
   body:JSON.stringify({
      message:msg
   })
 });

 const data=await response.json();

 chat.innerHTML += `
 <div class="message ai">
 ${JSON.stringify(data)}
 </div>
 `;

 }catch(err){

 chat.innerHTML += `
 <div class="message ai">
 Error: ${err.message}
 </div>
 `;

 }

}

</script>

</body>
</html>
